name: CI — Web Application

on:
  push:
    branches: [main, develop]
    paths:
      - 'WebApplication/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'WebApplication/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

defaults:
  run:
    working-directory: WebApplication

jobs:
  quality:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: WebApplication/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Prettier check
        run: npm run format:check --if-present

      - name: ESLint
        run: npm run lint --if-present

      - name: Type check
        run: npm run typecheck --if-present

      - name: Unit tests
        run: npm test --if-present
        env:
          NODE_ENV: test
          HF_FREE_API_TOKEN: hf_dummy_token_for_ci

      - name: Build
        run: npm run build --if-present

      - name: Verify no secrets are tracked
        working-directory: .
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::A .env file is tracked in git. Remove it and rotate the token."
            exit 1
          fi
          echo "No .env files tracked."

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: inwebtools-web-${{ github.sha }}
          path: |
            WebApplication/server/dist
            WebApplication/client/dist
          retention-days: 7
          if-no-files-found: ignore
