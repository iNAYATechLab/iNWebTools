services:
  db:
    image: postgres:17-alpine
    container_name: inwebtools-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-inwebtools}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inwebtools-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-inwebtools}
      JWT_SECRET: ${JWT_SECRET:-inwebtools_prod_secure_secret_key_change_me_in_env}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://inwebtools.com}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}
      ASR_MODEL: ${ASR_MODEL:-openai/whisper-large-v3-turbo}
    ports:
      - '127.0.0.1:5000:5000'

  nginx:
    image: nginx:alpine
    container_name: inwebtools-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./client/dist:/usr/share/nginx/html:ro
      - certs_data:/etc/letsencrypt:ro

volumes:
  postgres_data:
    driver: local
  certs_data:
    driver: local
